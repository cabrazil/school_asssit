services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: school-assist
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - WA_SESSION_DIR=/app/wa-session
      - WA_BOT_PHONE=${WA_BOT_PHONE}
      - PORT=3000
    volumes:
      # Sessão WhatsApp persistida fora do container
      - ./wa-session:/app/wa-session
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
